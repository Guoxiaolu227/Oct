skill_id: "baseline-fairness-audit"
skill_version: "0.1.0"
mechanism_id: "FM-R3-03"
rules:
  - rule_id: "BF-001"
    question: "Does the baseline set test the manuscript's exact comparative claim?"
    confirmation_requires: "An explicit comparative claim and a missing or unsuitable comparator necessary to test it."
    non_issue: "The claim is non-comparative or the manuscript justifies an appropriate substitute."
  - rule_id: "BF-002"
    question: "Are model-selection and tuning opportunities materially asymmetric?"
    confirmation_requires: "Exact protocols showing unequal opportunity plus a plausible effect on the comparison."
    non_issue: "Each method receives a comparable validation protocol and budget."
  - rule_id: "BF-003"
    question: "Do data, compute, or pretraining differences confound the stated advantage?"
    confirmation_requires: "Observed differences and a claim that attributes their effect to the proposed method."
    non_issue: "The claim includes those resources or the comparison controls them."
  - rule_id: "BF-004"
    question: "Could run selection or unreported variability make the ranking unsupported?"
    confirmation_requires: "Evidence of selected-best reporting or a stability claim contradicted by the protocol."
    non_issue: "The manuscript uses consistent aggregation and uncertainty reporting."
