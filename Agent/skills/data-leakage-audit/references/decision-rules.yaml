skill_id: "data-leakage-audit"
skill_version: "0.1.0"
mechanism_id: "FM-R3-01"
rules:
  - rule_id: "DL-001"
    question: "Did test or evaluation information influence model or configuration selection?"
    confirmation_requires: "Exact text connecting evaluation results or samples to a development decision."
    non_issue: "Selection uses an independent validation set and the final test is used after freezing."
  - rule_id: "DL-002"
    question: "Was a data-dependent preprocessing or feature-selection step fitted outside the training partition?"
    confirmation_requires: "Exact operation order and evidence that held-out information affected fitted state."
    non_issue: "The transform is fitted on training data and only applied to held-out data."
  - rule_id: "DL-003"
    question: "Do related entities, duplicates, labels, or future information cross the intended evaluation boundary?"
    confirmation_requires: "Manuscript evidence of overlap or label/future-derived input plus relevance to the target claim."
    non_issue: "A grouped or temporal split prevents the relevant information transfer."
  - rule_id: "DL-004"
    question: "Is the only signal an undocumented split or preprocessing detail?"
    confirmation_requires: "Never confirms leakage; classify as suspected reporting gap or insufficient evidence."
    non_issue: "Elsewhere in the MMD the protocol is explicitly resolved."
