skill_id: "control-ablation-audit"
skill_version: "0.1.0"
mechanism_id: "FM-R3-05"
rules:
  - rule_id: "CA-001"
    question: "Does the paper make an attribution claim that requires a contrast?"
    confirmation_requires: "An explicit attribution and absence of evidence that can distinguish it from alternatives."
    non_issue: "The paper claims only whole-system effectiveness."
  - rule_id: "CA-002"
    question: "Does an ablation isolate the claimed component while holding material factors comparable?"
    confirmation_requires: "Multiple simultaneous changes that prevent component-specific attribution."
    non_issue: "The contrast changes the target component without a material competing change."
  - rule_id: "CA-003"
    question: "Are plausible alternative explanations left uncontrolled?"
    confirmation_requires: "Alternatives grounded in observed design differences and relevant to the claim."
    non_issue: "Existing controls or design structure exclude the material alternatives."
  - rule_id: "CA-004"
    question: "Would the requested experiment change claim validity rather than merely extend the paper?"
    confirmation_requires: "A clear explanation of which current inference fails without the control."
    non_issue: "The experiment is optional follow-up work or the claim is already scoped accordingly."
