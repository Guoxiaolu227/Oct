skill_id: "metric-alignment-audit"
skill_version: "0.1.0"
mechanism_id: "FM-R3-04"
rules:
  - rule_id: "MA-001"
    question: "Does the metric measure the capability or outcome named in the claim?"
    confirmation_requires: "An explicit target claim and a demonstrated property the metric does not measure."
    non_issue: "The claim is explicitly limited to the reported metric or validates the proxy."
  - rule_id: "MA-002"
    question: "Does aggregation hide claim-relevant class errors or imbalance?"
    confirmation_requires: "Task distribution/aggregation evidence and a claim about the hidden class behavior."
    non_issue: "Class-sensitive or appropriately aggregated results support the claim."
  - rule_id: "MA-003"
    question: "Are threshold, ranking, or calibration properties compatible with the claim?"
    confirmation_requires: "A decision/probability claim and metrics that cannot establish the relevant property."
    non_issue: "The evaluation includes the relevant threshold or calibration analysis."
  - rule_id: "MA-004"
    question: "Does a subgroup or deployment claim have evaluation at the corresponding scope?"
    confirmation_requires: "A subgroup-specific claim and only aggregate evidence that can mask it."
    non_issue: "The claim is population-average or the subgroup is separately evaluated."
