skill_id: "sampling-split-audit"
skill_version: "0.1.0"
mechanism_id: "FM-R3-02"
rules:
  - rule_id: "SS-001"
    question: "Does the sampled population match the population or environment named in the claim?"
    confirmation_requires: "Exact source/selection evidence, an explicit target claim, and a defensible mismatch chain."
    non_issue: "The claim is limited to the observed population or distribution."
  - rule_id: "SS-002"
    question: "Does the split unit match the intended unit of generalization?"
    confirmation_requires: "Evidence of record/entity grouping and a claim about unseen entities or groups."
    non_issue: "The split is grouped at the relevant unit or the target includes known entities."
  - rule_id: "SS-003"
    question: "Does a temporal task preserve the intended train-before-test order?"
    confirmation_requires: "Exact temporal protocol and a future-time or prospective claim."
    non_issue: "The study is explicitly contemporaneous or uses an appropriate temporal split."
  - rule_id: "SS-004"
    question: "Do scope limitations or subgroup analyses resolve the apparent mismatch?"
    confirmation_requires: "A mismatch remaining after all stated scope restrictions are applied."
    non_issue: "The manuscript explicitly narrows the conclusion to the sampled setting."
